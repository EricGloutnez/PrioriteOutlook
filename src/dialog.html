<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Numéro de projet</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css?v=4">
</head>
<body class="dialogue">
  <main aria-labelledby="titreDialogue">
    <header class="entete-dialogue">
      <span class="pastille" id="pastilleNiveau">P1</span>
      <h1 id="titreDialogue">Numéro de projet</h1>
    </header>

    <div class="types" role="radiogroup" aria-label="Type de projet">
      <button type="button" class="type" role="radio" aria-checked="false" data-type="M">Multi</button>
      <button type="button" class="type" role="radio" aria-checked="false" data-type="R">Résidentiel</button>
    </div>

    <label class="champ" for="numeroProjet">
      <span>Numéro de projet</span>
      <input id="numeroProjet" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="11111">
    </label>
    <p class="erreur" id="erreurProjet" role="alert"></p>

    <p class="apercu-dialogue" id="apercuDialogue" aria-live="polite"></p>

    <div class="actions">
      <button type="button" class="bouton" id="btnPasser">Passer</button>
      <button type="button" class="bouton bouton-principal" id="btnAppliquer">Appliquer</button>
    </div>
  </main>

  <script src="dialog.js?v=4"></script>
</body>
</html>
