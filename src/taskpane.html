<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Priorité Bonneville</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css?v=11">
</head>
<body>
  <main id="vuePrincipale">
    <header class="entete">
      <h1>Priorité du courriel</h1>
      <button type="button" class="bouton-icone" id="btnParametres" aria-label="Paramètres" title="Paramètres">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7.43-2.53.04-.97-.04-.97 2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.49.49 0 0 0 .12.64l2.11 1.65-.04.97.04.97-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.49.42h4c.24 0 .45-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1c.22.08.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65Z"/></svg>
      </button>
    </header>

    <section class="apercu-objet" aria-label="Aperçu de l'objet">
      <span class="apercu-titre">Objet</span>
      <div class="apercu-ligne">
        <span class="puce-balise" id="puceBalise">Aucune priorité</span>
        <span class="apercu-reste" id="apercuReste"></span>
      </div>
    </section>

    <section aria-labelledby="titreNiveaux">
      <h2 id="titreNiveaux" class="visuellement-cache">Niveau de priorité</h2>
      <div class="niveaux" role="radiogroup" aria-labelledby="titreNiveaux">
        <button type="button" class="niveau" role="radio" aria-checked="false" data-niveau="URGENT" title="Urgent"><span class="pastille-couleur c-urgent" aria-hidden="true"></span>Urg.</button>
        <button type="button" class="niveau" role="radio" aria-checked="false" data-niveau="P1"><span class="pastille-couleur c-p1" aria-hidden="true"></span>P1</button>
        <button type="button" class="niveau" role="radio" aria-checked="false" data-niveau="P2"><span class="pastille-couleur c-p2" aria-hidden="true"></span>P2</button>
        <button type="button" class="niveau" role="radio" aria-checked="false" data-niveau="P3"><span class="pastille-couleur c-p3" aria-hidden="true"></span>P3</button>
        <button type="button" class="niveau niveau-large" role="radio" aria-checked="false" data-niveau="CONFIDENTIEL">
          <svg class="cadenas" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1Zm2 0h6V7a3 3 0 0 0-6 0v3Zm3 4a1.5 1.5 0 0 0-1 2.6V18h2v-1.4A1.5 1.5 0 0 0 12 14Z"/></svg>Confidentiel
        </button>
      </div>
      <p class="erreur" id="erreurNiveau" role="alert"></p>
    </section>

    <div class="ligne-projet">
      <svg class="icone-projet" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v4h4a1 1 0 0 1 1 1v11h1v2H3v-2h1Zm2 0h7V6H6v15Zm9 0h3v-10h-3v10ZM8 8h3v2H8V8Zm0 4h3v2H8v-2Zm0 4h3v2H8v-2Z"/></svg>
      <span class="projet-texte" id="projetTexte">Aucun projet</span>
      <button type="button" class="lien" id="lienProjet">Ajouter</button>
    </div>

    <div class="actions">
      <button type="button" class="bouton" id="btnRetirer">Retirer</button>
    </div>
    <p class="statut" id="statut" aria-live="polite"></p>
  </main>

  <section id="vueParametres" hidden aria-labelledby="titreParametres">
    <header class="entete">
      <button type="button" class="bouton-icone" id="btnRetour" aria-label="Retour" title="Retour">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg>
      </button>
      <h1 id="titreParametres">Paramètres</h1>
    </header>

    <label class="bascule">
      <span class="bascule-texte">
        <span>Bannière et rappel à l'envoi</span>
        <small>Affiche la bannière à la création d'un courriel et un rappel si vous envoyez sans priorité.</small>
      </span>
      <input type="checkbox" id="paramBanniere">
    </label>

    <label class="bascule">
      <span class="bascule-texte">
        <span>Demander un numéro de projet</span>
        <small>Ouvre la fenêtre du projet après le choix du niveau. Sinon, le lien « Ajouter » de la ligne Projet reste disponible au besoin.</small>
      </span>
      <input type="checkbox" id="paramProjet">
    </label>

    <fieldset class="choix-defaut">
      <legend>Type de projet par défaut</legend>
      <label><input type="radio" name="typeDefaut" value=""> Aucun</label>
      <label><input type="radio" name="typeDefaut" value="M"> Multi</label>
      <label><input type="radio" name="typeDefaut" value="R"> Résidentiel</label>
    </fieldset>

    <p class="statut" id="statutParametres" aria-live="polite"></p>
  </section>

  <script src="tag.js?v=11"></script>
  <script src="taskpane.js?v=11"></script>
</body>
</html>
